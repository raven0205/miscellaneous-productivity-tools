[project]
name = "expense-splitter-backend"
version = "0.1.0"
description = "FastAPI backend for the expense splitter frontend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "httpx>=0.27.0",
  "pytest>=8.3.2",
  "sqlalchemy>=2.0.52",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
