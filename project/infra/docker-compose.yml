version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: autopilot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autopilot_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autopilot_pass}
      POSTGRES_DB: ${POSTGRES_DB:-autopilot_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autopilot_user -d autopilot_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    container_name: autopilot_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://autopilot_user:autopilot_pass@postgres:5432/autopilot_db
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    container_name: autopilot_worker
    restart: unless-stopped
    command: python -m app.worker.polling_worker
    environment:
      - DATABASE_URL=postgresql://autopilot_user:autopilot_pass@postgres:5432/autopilot_db
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.frontend
    container_name: autopilot_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data: